# Routine version updates wait seven days; security fixes are not delayed.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-minor-and-patch:
      applies-to: security-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
- package-ecosystem: nuget
  directory: /
  # Accepted Avalonia 11 compatibility limit: realgarit/realsnag-media-downloader#25.
  ignore:
  - dependency-name: "Avalonia*"
    versions: ["[12.0.0,)"]
  - dependency-name: "Semi.Avalonia"
    versions: ["[12.0.0,)"]
  schedule:
    interval: weekly
    day: monday
    time: "06:00"
    timezone: Europe/Zurich
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
    security-minor-and-patch:
      applies-to: security-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
